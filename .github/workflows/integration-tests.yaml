name: Integration Tests

on:
  push:
    branches:
      - main
      - develop
    paths:
      - 'src/**'
      - 'drizzle/**'
      - 'supabase/**'
      - 'tests/integration/**'
      - 'docker/**'
      - 'scripts/test-integration.sh'
      - 'vitest.integration.config.ts'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/integration-tests.yaml'
  pull_request:
    branches:
      - main
      - develop
    paths:
      - 'src/**'
      - 'drizzle/**'
      - 'supabase/**'
      - 'tests/integration/**'
      - 'docker/**'
      - 'scripts/test-integration.sh'
      - 'vitest.integration.config.ts'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/integration-tests.yaml'
  workflow_dispatch:

jobs:
  integration:
    name: Docker IT lifecycle
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run integration tests
        run: npm run test:integration
